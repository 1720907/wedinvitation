name: Build and Deploy to gh-pages

on:
  push:
    branches: [ "main" ] # Se dispara cuando haces push a tu rama principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Vital para que la acción pueda escribir/crear la rama gh-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Carpeta que genera Vite
          publish_branch: gh-pages # La rama donde se guardarán los estáticos
