name: Build and Deploy to gh-pages

on:
  push:
    branches: [ "main" ] # Se dispara cuando haces push a tu rama principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instal & Build
        run: npm i && npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Carpeta que genera Vite
          publish_branch: gh-pages # La rama donde se guardarán los estáticos
